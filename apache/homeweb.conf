<VirtualHost *:8080>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    AliasMatch "^/__homeweb/status$" "/opt/homeweb/public/status.php"
    # Existing ThuisWeb starter pages keep working after an explicit migration.
    AliasMatch "^/__thuisweb/status$" "/opt/homeweb/public/status.php"
    # PHP advisory 2026-10-23: prevent upload-progress deserialization attacks.
    php_admin_flag session.upload_progress.enabled Off
    <Directory /opt/homeweb/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    RedirectMatch 404 "(^|/)\.(?!well-known/)"
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride AuthConfig FileInfo Limit
        Require all granted
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
<VirtualHost 127.0.0.1:8081>
    DocumentRoot /opt/homeweb/health
    ErrorLog /proc/self/fd/2
    <Directory /opt/homeweb/health>
        AllowOverride None
        Options -Indexes
        Require local
    </Directory>
</VirtualHost>
