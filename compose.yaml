services:
  thuisweb:
    image: ghcr.io/marcvandecoevering/thuisweb:php8.3
    platform: linux/amd64
    ports:
      - "127.0.0.1:${THUISWEB_PORT:-8583}:8080"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      PHP_MEMORY_LIMIT: 256M
      PHP_UPLOAD_LIMIT: 32M
      TZ: Europe/Amsterdam
    volumes:
      - ./www:/var/www/html
      - ./config:/config
    restart: unless-stopped
